webdriver {
  driver = chrome
  autodownload = true
}

headless.mode = false

serenity {
  take.screenshots = FOR_EACH_ACTION
  console.colors = true
  logging = NORMAL
  test.root = "stepdefinitions"
  requirements.dir = "src/test/resources/features"
  report {
         accessibility = true
      }
}

chrome.switches = """--start-maximized;--remote-allow-origins=*;--incognito"""