webdriver {
  driver = chrome
    autodownload = true
    capabilities {
      browserName = "chrome"
      "goog:chromeOptions" {
        args = ["--start-maximized", "--remote-allow-origins=*", "--incognito"]
      }
    }
}

headless.mode = false

serenity {
  encoding = "UTF-8"
  compress.filenames = true
  take.screenshots = FOR_EACH_ACTION
}
