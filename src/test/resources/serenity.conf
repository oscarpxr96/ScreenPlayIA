webdriver {
  driver = chrome
    autodownload = true
    capabilities {
      browserName = "chrome"
      "goog:chromeOptions" {
        args = ["--start-maximized", "--remote-allow-origins=*", "--incognito"]
      }
    }
}

headless.mode = false

serenity {
  # Mantiene la MISMA ventana durante todo el escenario del flujo E2E
  #  restart.browser.for.each = NEVER
  # O si prefieres que se limpie la ventana al cambiar deScenario:
  restart.browser.for.each = scenario
  take.screenshots = FOR_EACH_ACTION
  console.colors = true
  logging = NORMAL
  test.root = "stepdefinitions"
  requirements.dir = "src/test/resources/features"
  report {
         accessibility = true
      }
}
